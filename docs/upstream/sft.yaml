# @package _global_
# LoRA segment forcing fine-tuning from a non-distilled checkpoint.
defaults:
  - _self_

name: segment_lora
output_dir: ./outputs/segment_lora
dit_weight: /path/to/non_distilled_model.safetensors
global_seed: 42

logging:
  log_interval: 1

model:
  camera:
    use_camera_control: true
    injection_mode: extrinsics_attn
    per_chunk_camera_attn: true
    camera_chunk_size: 1
    per_segment_camera_dropout_p: 0.5
    per_segment_camera_dropout_min_on: 1
    strip_camera_text_blocks: true
  dit:
    model_type: HY-Nomas-G/2-32324-MMDiT
    attn_mode: magi_mp_causal
    master_weight_type: fp32
    unpad_zero_tokens: true
  text_encoder:
    name: qwen-2.5vl-7b
    model_name: Qwen/Qwen2.5-VL-7B-Instruct
    text_encoder_precision: bf16
    text_states_dim: 3584
    text_len: 1280
    tokenizer: qwen-2.5vl-7b
    prompt_template: li-dit-encode-image-json
    prompt_template_video: li-dit-encode-video-json
    hidden_state_skip_layer: 2
    text_projection: single_refiner
  vae:
    name: dcae-v-f32t4c32
    vae_precision: bf16
    vae_tiling: false
    vae_encode_tile_size: -1

dataset:
  data_file: null
  video_batch_size: 1
  # Whole-sample CFG dropout, as in the Stage7 SFT loader.
  uncond_p: 0.0
  fps: 24
  json_prompt_desc_mid_prob: 0.0
  json_prompt_no_desc_long_after_first: true
  json_prompt_normalize_action_timestamp: true
  global_only_in_first_segment: true
  json_prompt_keep_keys:
    - Style
    - perspective_view
    - subject_list
    - subject_list.subject_id
    - subject_list.display_name
    - subject_list.subject_attribute
    - segments
    - segments.visual_description_long
    - segments.description_change
    - segments.contained_actions
    - segments.contained_actions.start_time
    - segments.contained_actions.end_time
    - segments.contained_actions.action_description
  token_packing: true
  token_packing_shuffle_chunks_each_epoch: false
  token_packing_sorted_groups_path: /path/to/sorted_groups.json

training:
  training_mode: segment_self_forcing
  finetune_mode: lora
  lora:
    rank: 256
    alpha: 256.0
    dropout: 0.0
    adapter_path: null
  intra_segment_action_mask: true
  cross_segment_text_head_only: true
  scheduler:
    flow_shift_video: 5.0
  ema:
    ema_rates: []
    ema_schedule: []
  optimizer:
    name: muon
    adamw_betas: [0.9, 0.95]
    adamw_eps: 1.0e-8
    weight_decay: 0.0
    adamw_weight_decay: 0.0
    momentum: 0.95
    muon_comm_mode: canzona
    muon_canzona_fused_comm: true
    muon_canzona_balance: global
    muon_canzona_balance_cost: numel
    muon_canzona_overlap: none
    muon_exclude_patterns:
      - "img_in.*"
      - "txt_in.*"
      - "time_in.*"
      - "guidance_in.*"
      - "final_layer.*"
    enable_grad_norm_clip: true
    max_grad_norm: 1.0
    learning_rate: 1.0e-4
    max_train_steps: 2000
    checkpointing_steps: 10
    lr_warmup_steps: 0
    lr_scheduler: constant
    save_optimizer_state: true
    enable_dcp_checkpoint: true
    resume: null
  segment_self_forcing:
    streaming_backward: true
    skip_last_segment_cache_write: true
    timestep_sample_method: logit_normal
    timestep_shift: 3.0
    df_random_prefix: false
    prefix_flow_matching_loss: false
    context_low_t_min: 0.1
    context_low_t_max: 0.3
    end_noise: false

parallelism:
  sp_size: 8
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  selective_checkpointing: 1.0
  fsdp_sharding_strategy: hybrid
  # 128 GPUs give DP16 x SP8; the data-parallel degree follows the launch size.
  fsdp_hybrid_shard_size: 1

inference:
  solver_type: euler
  infer_steps_video: 50
  infer_flow_shift_video: 5.0
  cfg_scale_video: 6.0
